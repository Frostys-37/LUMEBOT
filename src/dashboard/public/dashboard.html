<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard — Lumecraft</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1e1f22; color:#e3e5e8; margin:0; padding:2rem; }
  table { width:100%; border-collapse: collapse; margin-top:1rem; }
  th, td { text-align:left; padding:.6rem; border-bottom:1px solid #3a3c41; }
  select, button { background:#2b2d31; color:#e3e5e8; border:1px solid #3a3c41; border-radius:6px; padding:.3rem .5rem; }
  button.guardar { cursor:pointer; margin-left:.4rem; }
  .Pendiente { color:#f0b232; }
  .Aceptado { color:#57f287; }
  .Denegado { color:#ed4245; }
  .Resuelto { color:#5865f2; }
</style>
</head>
<body>
  <h1>Reportes</h1>
  <table id="tabla">
    <thead>
      <tr><th>ID</th><th>Usuario MC</th><th>Motivo</th><th>Estado</th><th>Acción</th></tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
async function cargar() {
  const res = await fetch("/api/reports");
  if (res.status === 401 || res.status === 403) return (location.href = "/");
  const reportes = await res.json();
  const tbody = document.querySelector("#tabla tbody");
  tbody.innerHTML = "";

  for (const rep of reportes) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${rep.reportId}</td>
      <td>${rep.mcUser}</td>
      <td>${rep.reason}</td>
      <td class="${rep.status}">${rep.status}</td>
      <td>
        <select data-id="${rep.reportId}">
          <option ${rep.status === "Pendiente" ? "selected" : ""}>Pendiente</option>
          <option ${rep.status === "Aceptado" ? "selected" : ""}>Aceptado</option>
          <option ${rep.status === "Denegado" ? "selected" : ""}>Denegado</option>
          <option ${rep.status === "Resuelto" ? "selected" : ""}>Resuelto</option>
        </select>
        <button data-id="${rep.reportId}" class="guardar">Guardar</button>
      </td>`;
    tbody.appendChild(tr);
  }

  document.querySelectorAll(".guardar").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const select = document.querySelector(`select[data-id="${id}"]`);
      await fetch(`/api/reports/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: select.value }),
      });
      cargar();
    });
  });
}

cargar();
</script>
</body>
</html>
